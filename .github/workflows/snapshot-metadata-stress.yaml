name: Snapshot Metadata Stress E2E

on:
  push:
    branches:
      - snapshot-metadata-stress
  workflow_dispatch:

jobs:
  e2e-snapshot-metadata-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ARTIFACTS: /tmp/e2e-artifacts
      KIND_NODE_IMAGE: kindest/node:v1.34.0
      SNAPSHOTTER_VERSION: v8.4.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean

      - name: Install tools
        run: |
          go install sigs.k8s.io/kind@latest

      - name: Build test binaries
        run: |
          make all WHAT="cmd/kubectl test/e2e/e2e.test vendor/github.com/onsi/ginkgo/v2/ginkgo"
          echo "${PWD}/_output/bin" >> "$GITHUB_PATH"

      - name: Increase loop devices
        run: |
          sudo modprobe loop max_loop=64 || true
          for i in $(seq 0 63); do sudo mknod -m 0660 /dev/loop$i b 7 $i 2>/dev/null || true; done
          ls /dev/loop* | wc -l

      - name: Create kind cluster
        run: |
          mkdir -p "${ARTIFACTS}"
          cat <<'EOF' > /tmp/kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
- role: worker
- role: worker
EOF
          kind create cluster \
            --image="${KIND_NODE_IMAGE}" \
            --retain \
            --wait=1m \
            --config=/tmp/kind-config.yaml

      - name: Install snapshot CRDs and controller
        run: |
          kubectl apply -f ./cluster/addons/volumesnapshots/crd/snapshot.storage.k8s.io_volumesnapshotclasses.yaml
          kubectl apply -f ./cluster/addons/volumesnapshots/crd/snapshot.storage.k8s.io_volumesnapshotcontents.yaml
          kubectl apply -f ./cluster/addons/volumesnapshots/crd/snapshot.storage.k8s.io_volumesnapshots.yaml
          kubectl apply -f test/e2e/testing-manifests/storage-csi/external-snapshot-metadata/cbt.storage.k8s.io_snapshotmetadataservices.yaml
          kubectl apply -f "https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/refs/tags/${SNAPSHOTTER_VERSION}/deploy/kubernetes/snapshot-controller/rbac-snapshot-controller.yaml"
          curl -s "https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/refs/tags/${SNAPSHOTTER_VERSION}/deploy/kubernetes/snapshot-controller/setup-snapshot-controller.yaml" | \
            sed "s|image: registry.k8s.io/sig-storage/snapshot-controller:.*|image: registry.k8s.io/sig-storage/snapshot-controller:${SNAPSHOTTER_VERSION}|" | \
            kubectl apply -f -

      - name: Run snapshot metadata stress tests
        env:
          CSI_PROW_ENABLE_SNAPSHOT_METADATA: "true"
          KUBERNETES_CONFORMANCE_TEST: "y"
          KUBE_CONTAINER_RUNTIME: remote
          KUBE_CONTAINER_RUNTIME_ENDPOINT: unix:///run/containerd/containerd.sock
          KUBE_CONTAINER_RUNTIME_NAME: containerd
        run: |
          ./hack/ginkgo-e2e.sh \
            '--provider=skeleton' \
            '--num-nodes=2' \
            '--ginkgo.focus=snapshot-metadata-stress' \
            '--ginkgo.skip=' \
            "--report-dir=${ARTIFACTS}" \
            '--disable-log-dump=true'

      - name: Export logs
        if: always()
        run: kind export logs "${ARTIFACTS}/kind-logs" || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-snapshot-metadata-stress
          path: /tmp/e2e-artifacts
