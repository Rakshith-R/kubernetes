name: Snapshot Metadata Stress E2E

on:
  push:
    branches:
      - snapshot-metadata-stress
  workflow_dispatch:

jobs:
  e2e-snapshot-metadata-stress:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ARTIFACTS: /tmp/e2e-artifacts
      FOCUS: "snapshot-metadata-stress"
      SKIP: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install kind (from HEAD for latest k8s compat)
        run: go install sigs.k8s.io/kind@main

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Run snapshot metadata stress e2e
        run: |
          mkdir -p "${ARTIFACTS}"
          bash test/e2e/testing-manifests/storage-csi/external-snapshot-metadata/run_snapshot_metadata_e2e.sh

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-snapshot-metadata-stress
          path: /tmp/e2e-artifacts
